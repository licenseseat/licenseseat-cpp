name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, 'pr/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  dependency-audit:
    name: Vendored dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify exact sources and query OSV
        run: python3 scripts/audit-vendored-dependencies.py --online

      - name: Check patch integrity
        run: git diff --check

  linux:
    name: Linux (${{ matrix.compiler }})
    needs: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libgtest-dev cmake ninja-build

      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DLICENSESEAT_BUILD_TESTS=ON \
            -DLICENSESEAT_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2

      - name: Verify installed CMake package
        run: |
          cmake --install build --prefix package
          cmake -S tests/package-consumer -B package-consumer-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="$PWD/package"
          cmake --build package-consumer-build
          ./package-consumer-build/licenseseat_package_consumer

  macos:
    name: macOS (${{ matrix.os }})
    needs: dependency-audit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install dependencies
        run: brew install openssl@3 googletest ninja

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DLICENSESEAT_BUILD_TESTS=ON \
            -DLICENSESEAT_BUILD_EXAMPLES=ON \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2

  windows:
    name: Windows (MSVC)
    needs: dependency-audit
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VCPKG_BINARY_SOURCES: clear

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pinned vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ea1a7396b05637a53bf23c078647ecc0edee4b80

      - name: Configure
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_MANIFEST_FEATURES=tests `
            -DLICENSESEAT_BUILD_TESTS=ON `
            -DLICENSESEAT_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Test
        run: ctest --test-dir build --output-on-failure -C ${{ env.BUILD_TYPE }} --parallel 2

  conan-package:
    name: Conan package consumer
    needs: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Conan client
        run: |
          python3 -m venv "${RUNNER_TEMP}/conan-venv"
          "${RUNNER_TEMP}/conan-venv/bin/pip" install "conan==2.24.0"
          echo "${RUNNER_TEMP}/conan-venv/bin" >> "$GITHUB_PATH"

      - name: Build and consume Conan package
        run: |
          conan profile detect --force
          conan create . --build=missing -o '&:build_tests=False'

  single-header:
    name: Single-header distribution
    needs: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Generate single header
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${GITHUB_SHA}")"
          export SOURCE_DATE_EPOCH
          python3 scripts/amalgamate.py > "${RUNNER_TEMP}/licenseseat_single.hpp"

      - name: Compile and run smoke test
        run: |
          cat > "${RUNNER_TEMP}/test_single_header.cpp" <<'EOF'
          #define LICENSESEAT_IMPLEMENTATION
          #include "licenseseat_single.hpp"

          #include <cassert>

          int main() {
              const std::string input = "Hello, LicenseSeat!";
              const auto encoded = licenseseat::crypto::base64_encode(
                  std::vector<uint8_t>(input.begin(), input.end()));
              const auto decoded = licenseseat::crypto::base64_decode(encoded);
              assert(std::string(decoded.begin(), decoded.end()) == input);
              assert(!licenseseat::device::generate_device_id().empty());
              return 0;
          }
          EOF
          g++ -std=c++17 \
            -DCPPHTTPLIB_OPENSSL_SUPPORT \
            -I"${RUNNER_TEMP}" \
            -I"${GITHUB_WORKSPACE}/deps" \
            "${RUNNER_TEMP}/test_single_header.cpp" \
            -o "${RUNNER_TEMP}/test_single_header" \
            -lssl -lcrypto -pthread
          "${RUNNER_TEMP}/test_single_header"

      - name: Upload generated header
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: licenseseat-single-header
          path: ${{ runner.temp }}/licenseseat_single.hpp
          if-no-files-found: error
          retention-days: 7

  sanitizers:
    name: Sanitizer (${{ matrix.sanitizer }})
    needs: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
            flags: -fsanitize=address -fno-omit-frame-pointer
          - sanitizer: undefined
            flags: -fsanitize=undefined -fno-omit-frame-pointer

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libgtest-dev cmake ninja-build clang

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLICENSESEAT_BUILD_TESTS=ON \
            -DLICENSESEAT_BUILD_EXAMPLES=OFF \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_C_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure --parallel 2

  static-analysis:
    name: Clang static analyzer
    needs: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev cmake ninja-build clang clang-tools

      - name: Configure through analyzer compiler wrappers
        run: |
          scan-build cmake -S . -B build-analyzer \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLICENSESEAT_BUILD_TESTS=OFF \
            -DLICENSESEAT_BUILD_EXAMPLES=OFF

      - name: Analyze
        run: |
          scan-build --status-bugs \
            -enable-checker unix.BlockInCriticalSection \
            cmake --build build-analyzer
